name: Laravel

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]


jobs:
  laravel-tests:

    runs-on: ubuntu-latest


    services:
      mysql:
        image: mysql:8.0

        env:
          MYSQL_DATABASE: taskforge
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5


    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, dom, fileinfo, pdo_mysql
          coverage: none


      - name: Copy environment file
        run: cp .env.example .env


      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction


      - name: Generate application key
        run: php artisan key:generate


      - name: Clear Laravel Configuration Cache
        run: |
          php artisan config:clear
          php artisan cache:clear


      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h127.0.0.1 --silent; then
              echo "MySQL is ready!"
              break
            fi
            echo "Attempt $i: Waiting for MySQL to be ready..."
            sleep 2
          done


      - name: Run Database Migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: taskforge
          DB_USERNAME: root
          DB_PASSWORD: ""
        run: php artisan migrate --force


      - name: Run Laravel Tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: taskforge
          DB_USERNAME: root
          DB_PASSWORD: ""
        run: php artisan test
